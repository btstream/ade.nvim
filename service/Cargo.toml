[package]
name = "nvim_ade_server"
version = "0.2.0"
edition = "2021"
description = "Background service for ade.nvim (ACP agent manager)"
license = "MIT"
publish = false

[[bin]]
name = "nvim_ade_server"
path = "src/main.rs"

[dependencies]
libc = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# SQLite event log (see `src/store.rs`). `bundled` compiles the SQLite C
# amalgamation into the binary, so no system libsqlite3 is needed on any target.
# Default features are off: they enable the wasm-only `sqlite-wasm-rs` backend,
# which this service never uses. `cache` keeps a small prepared-statement cache.
rusqlite = { version = "0.42", default-features = false, features = [
    "bundled",
    "cache",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "process",
    "signal",
    "sync",
    "time",
] }
